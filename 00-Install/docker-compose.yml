version: '3.10'

# ==============================================================================
# ECHO FRAMEWORK v5 - INFRASTRUCTURE DEFINITION
# ==============================================================================
# Ce fichier remplace les commandes "docker run" impératives.
# Il définit l'état souhaité de l'infrastructure.
#
# STRATÉGIE "ZÉRO PERTE" (FROM SCRATCH MODE) :
# - Volume de données renommé en "echo-webui-data" pour cohérence.
# - Tous les volumes et réseaux sont "external: true" et créés par install-stack.sh.
# ==============================================================================

services:
  # --- 1. WATCHTOWER (AUTO-UPDATE) ---
  watchtower:
    image: containrrr/watchtower
    container_name: echo-watchtower
    restart: always
    networks:
      - ai-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup

  # --- 2. PYTHON WORKER (SANDBOX CODE) ---
  python-worker:
    image: python:3.11-slim
    container_name: echo-python-worker
    restart: always
    networks:
      - ai-net
    volumes:
      - /opt/python-worker/worker_api.py:/app/app.py
      - echo-worker-data:/app/data
    command: >
      /bin/bash -c "pip install --no-cache-dir flask flask-cors requests pandas numpy scipy scikit-learn matplotlib seaborn yfinance beautifulsoup4 openpyxl regex sympy && python /app/app.py"

  # --- 3. BROWSER AGENT (NAVIGATION WEB) ---
  browser-agent:
    image: python:3.11-slim
    container_name: echo-browser-agent
    restart: always
    networks:
      - ai-net
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
    volumes:
      - /opt/browser-agent/browser_api.py:/app/app.py
      - echo-browser-data:/app/data
    command: >
      /bin/bash -c "apt-get update && apt-get install -y chromium fonts-liberation libasound2 libnss3 libgbm1 libnspr4 xdg-utils && pip install --no-cache-dir flask flask-cors DrissionPage html2text && python /app/app.py"

  # --- 4. ADMIN MANAGER (OPS & MONITORING) ---
  admin-manager:
    image: python:3.11
    container_name: echo-admin-manager
    restart: always
    networks:
      - ai-net
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/admin-manager/server.py:/app/server.py
      - echo-backups:/backups
      # --- CHANGEMENT DE NOM DU VOLUME ---
      # On mappe le nouveau volume standardisé vers les chemins attendus par le script
      - echo-webui-data:/data
      - echo-webui-data:/app/backend/data
    command: >
      /bin/bash -c "pip install --no-cache-dir flask flask-cors docker psutil paramiko APScheduler schedule && python /app/server.py"

  # --- 5. OPEN WEBUI (INTERFACE PRINCIPALE) ---
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: echo-webui-core
    restart: always
    networks:
      - ai-net
    ports:
      - "3000:8080"
    volumes:
      # --- CHANGEMENT DE NOM DU VOLUME ---
      # Stockage persistant renommé proprement
      - echo-webui-data:/app/backend/data
      # Montage des scripts et configurations "Hot Reload" depuis l'hôte
      - /opt/owui-pipes:/opt/owui-pipes
      - /opt/owui-tools:/opt/owui-tools
      - /opt/owui-filters:/opt/owui-filters
      - /opt/owui-actions:/opt/owui-actions
      - /opt/owui-scripts:/opt/owui-scripts
    # Installation de mgzip au démarrage PUIS lancement du serveur (&& ./start.sh)
    # Sans ./start.sh, le conteneur s'arrête immédiatement après l'installation.
    command: >
      /bin/bash -c "pip install mgzip && ./start.sh"

# ==============================================================================
# RESSOURCES EXTERNES (PROVISIONNÉES PAR INSTALL-STACK.SH)
# ==============================================================================
networks:
  ai-net:
    external: true

volumes:
  # Nom standardisé. Correspond à "open-webui" dans l'ancienne version.
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true
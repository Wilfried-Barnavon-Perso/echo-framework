<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ECHO Auth{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(20, 25, 40, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        html,
        .auth-container {
            scrollbar-width: thin;
            scrollbar-color: rgba(96, 165, 250, 0.45) rgba(15, 23, 42, 0.6);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
            margin: 12px 0;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.45);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.75);
        }

        body {
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('/static/images/logo-echo-full.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            animation: unblur 1s ease-out forwards;
            filter: blur(20px);
        }

        @keyframes unblur {
            0% { filter: blur(20px); transform: scale(1.05); }
            100% { filter: blur(0); transform: scale(1); }
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(20, 25, 40, 0.88);
            z-index: -1;
            opacity: 0;
            animation: fadeOverlay 0.5s 1.5s forwards;
        }

        @keyframes fadeOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .auth-container {
            margin: auto;
            width: 100%;
            max-width: 420px;
            max-height: calc(100vh - 2rem);
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2.25rem;
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            opacity: 0;
            animation: fadeAuth 0.5s 1.5s forwards;
            z-index: 1;
            transition: max-width 0.25s ease;
        }

        .auth-container-wide {
            max-width: 880px;
            padding: 1.75rem 2.25rem;
        }

        select option {
            background-color: #141928;
            color: #f8fafc;
        }

        @media (max-width: 768px) {
            .auth-container,
            .auth-container-wide {
                padding: 1.5rem 1.25rem;
            }
        }

        @keyframes fadeAuth {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-container p {
            margin: 0.5rem 0 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        
        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .qr-container img {
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="auth-container {% block container_class %}{% endblock %}">
        <div class="logo-container">
            <h1>ECHO SECURITY</h1>
            <p>Access Control Center</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    <script>
        document.addEventListener('wheel', function (e) {
            const c = document.querySelector('.auth-container');
            if (c && !c.contains(e.target) && c.scrollHeight > c.clientHeight) {
                c.scrollTop += e.deltaY;
            }
        }, { passive: true });
    </script>
</body>
</html>

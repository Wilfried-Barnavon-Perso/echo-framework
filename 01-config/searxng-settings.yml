# ECHO FRAMEWORK - Configuration SearXNG (Souveraineté)
# VERSION : 6.18.2.1
# ==============================================================================
# Règle : Conserver uniquement les 5 dernières versions dans l'historique.
# Historique des versions :
# 6.18.2.1: Refonte déclarative résiliente Watchtower (contact_url, outgoing, plugins SXNGPlugin, 79 arbitrages moteurs sur 12 catégories, désactivation torrents).
# 5.226.18.0: Configuration initiale SearXNG pour ECHO Framework.

use_default_settings: true

general:
  instance_name: "ECHO SearXNG"
  # Surchargé dynamiquement par SEARXNG_CONTACT_URL dans stack-echo.yml (requis par wikipedia, wikidata, openstreetmap)
  contact_url: "mailto:admin@echo.local"

server:
  port: 8080
  bind_address: "0.0.0.0"
  # secret_key injecté via variable d'environnement SEARXNG_SECRET
  base_url: false
  image_proxy: true
  limiter: false
  public_instance: false

search:
  safe_search: 1
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 12.0
  pool_connections: 100
  enable_http2: true

ui:
  default_locale: "fr"
  center_alignment: true

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false


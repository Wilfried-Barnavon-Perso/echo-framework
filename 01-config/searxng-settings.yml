# Configuration SearxNG pour ECHO Framework (Souveraineté)
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  # secret_key: "echo_secret_key_change_me" # Injecté via variable d'env SEARXNG_SECRET
  base_url: false
  image_proxy: true

search:
  safe_search: 1
  autocomplete: duckduckgo
  formats:
    - html
    - json # INDISPENSABLE pour l'outil ECHO

engines:
  # --- GENERAL ---
  - name: google
    engine: google
    shortcut: g
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: brave
    engine: brave
    shortcut: br
  - name: startpage
    engine: startpage
    shortcut: sp
  - name: wikipedia
    engine: wikipedia
    shortcut: w
  - name: wikidata
    engine: wikidata
    shortcut: wd

  # --- IT ---
  - name: github
    engine: github
    shortcut: gh
  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
  - name: gitlab
    engine: gitlab
    shortcut: gl
  - name: pypi
    engine: pypi
    shortcut: py
  - name: npm
    engine: npm
    shortcut: npm
  - name: docker hub
    engine: docker hub
    shortcut: dh

  # --- SCIENCE ---
  - name: arxiv
    engine: arxiv
    shortcut: ar
  - name: pubmed
    engine: pubmed
    shortcut: pm
  - name: google scholar
    engine: google scholar
    shortcut: gs
  - name: crossref
    engine: crossref
    shortcut: cr
  - name: semantic scholar
    engine: semantic scholar
    shortcut: ss
  - name: openaire
    engine: openaire
    shortcut: oa

  # --- IMAGES ---
  - name: google images
    engine: google images
    shortcut: gi
  - name: duckduckgo images
    engine: duckduckgo images
    shortcut: ddi
  - name: qwant images
    engine: qwant images
    shortcut: qi
  - name: pinterest
    engine: pinterest
    shortcut: pin
  - name: unsplash
    engine: unsplash
    shortcut: uns
  - name: deviantart
    engine: deviantart
    shortcut: da

  # --- VIDEO ---
  - name: youtube
    engine: youtube
    shortcut: yt
  - name: vimeo
    engine: vimeo
    shortcut: vm
  - name: dailymotion
    engine: dailymotion
    shortcut: dm

  # --- SOCIAL MEDIA ---
  - name: reddit
    engine: reddit
    shortcut: rd
  - name: twitter
    engine: twitter
    shortcut: tw
  - name: mastodon
    engine: mastodon
    shortcut: mas
  - name: lemmy
    engine: lemmy
    shortcut: lm
  - name: hacker news
    engine: hacker news
    shortcut: hn

  # --- MUSIC ---
  - name: spotify
    engine: spotify
    shortcut: sfy
  - name: soundcloud
    engine: soundcloud
    shortcut: sc
  - name: youtube music
    engine: youtube music
    shortcut: ytm
  - name: genius
    engine: genius
    shortcut: gen
  - name: bandcamp
    engine: bandcamp
    shortcut: bc

  # --- MAP ---
  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
  - name: photon
    engine: photon
    shortcut: pho

ui:
  static_path: ""
  templates_path: ""
  default_locale: "fr"
  center_alignment: true

enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker avoidance'

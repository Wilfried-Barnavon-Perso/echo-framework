version: '3.8'

# ==============================================================================
# ECHO FRAMEWORK
# Version : 7.1
# ==============================================================================
# ARCHITECTURE :
# Ce fichier ne gère QUE la couche applicative "ECHO".
# ==============================================================================

services:

  # ============================================================================
  # SECTION 1 : APPLICATIONS PRINCIPALES
  # ============================================================================

  # 1. Open WebUI (Application IA)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: echo-webui-core
    restart: unless-stopped
    volumes:
      - echo-webui-data:/app/backend/data
      - /opt/ECHO_VERSION:/app/backend/data/ECHO_VERSION:ro
    # EXPOSITION : Port 3000 ouvert pour le Reverse Proxy distant
    ports:
      - "3000:8080"
    networks:
      - echo-network
    environment:
      # L'authentification interne reste active pour les utilisateurs de l'IA
      - WEBUI_AUTH=True
      # Fuseau horaire pour la cohérence des logs
      - TZ=Europe/Paris
      # URL publique gérée par le proxy externe
      # - WEBUI_URL=https://www.echo-ai.eu
      
    command: >
      /bin/bash -c "pip install mgzip && ./start.sh"

  # 2. Admin Manager (Dashboard Système ECHO)
  admin-manager:
    image: python:3.11
    container_name: echo-admin-manager
    restart: always
    networks:
      - echo-network
    environment:
      # Fuseau horaire pour l'affichage de l'heure. À adapter à votre localisation.
      # Exemples: "America/New_York", "Europe/London", "Asia/Tokyo"
      - TZ=Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker-admin-manager/server.py:/app/server.py:ro
      - echo-backups:/backups
      - echo-webui-data:/app/backend/data
      - /opt/.owui-secrets:/app/secrets:ro
      - /opt/ECHO_VERSION:/app/ECHO_VERSION:ro
    
    # EXPOSITION : Port 3001 ouvert pour le Reverse Proxy distant
    # IMPORTANT : Ce service n'a PAS d'auth intégrée. Le Proxy DOIT le protéger.
    ports:
      - "3001:3001"

    command: >
      /bin/bash -c "pip install --no-cache-dir flask flask-cors docker psutil paramiko APScheduler schedule httpx && python /app/server.py"

  # ============================================================================
  # SECTION 2 : WORKERS INTERNES (BACKEND)
  # ============================================================================
  
  python-worker:
    image: python:3.11-slim
    container_name: echo-python-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/docker-python-worker/worker_api.py:/app/app.py:ro
      - echo-worker-data:/app/data
    command: >
      /bin/bash -c "pip install --no-cache-dir flask flask-cors requests pandas numpy scipy scikit-learn matplotlib seaborn yfinance beautifulsoup4 openpyxl regex sympy && python /app/app.py"

  browser-agent:
    image: python:3.11-slim
    container_name: echo-browser-agent
    restart: always
    networks:
      - echo-network
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - TZ=Europe/Paris
    volumes:
      - /opt/docker-browser-agent/browser_api.py:/app/app.py:ro
      - echo-browser-data:/app/data
    command: >
      /bin/bash -c "apt-get update && apt-get install -y chromium fonts-liberation libasound2 libnss3 libgbm1 libnspr4 xdg-utils && pip install --no-cache-dir flask flask-cors DrissionPage html2text && python /app/app.py"

  watchtower:
    image: containrrr/watchtower
    container_name: echo-watchtower
    restart: always
    networks:
      - echo-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
    command: --interval 3600 --cleanup

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================

networks:
  echo-network:
    external: true


volumes:
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true
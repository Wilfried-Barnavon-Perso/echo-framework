# ==============================================================================
# ECHO FRAMEWORK
# Version : 8.7
# ==============================================================================
# CHANGELOG 8.7 : Migration embedding worker SigLIP-2 → bge-m3 (1024d, text-first).
# Ce fichier ne gère QUE la couche applicative "ECHO".
# ==============================================================================

services:

  # 1. Open WebUI (Le Cœur d'ECHO)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: echo-open-webui
    restart: always
    networks:
      - echo-network
    ports:
      - "3000:8080"
    environment:
      - WEBUI_AUTH=True
      - WEBUI_NAME="ECHO AI"
      # - CSRF_TRUSTED_ORIGINS=https://ui.${ECHO_DOMAIN:-localhost}
      - FORWARDED_ALLOW_IPS=*
      - TZ=Europe/Paris
      # Configuration Reverse Proxy (Doc Officielle)
      # - "WEBUI_URL=https://ui.${ECHO_DOMAIN:-localhost}"
      # Configuration vide car multi accès possible (privée, public www/ui ...). Sécurité par CORS_ALLOW_ORIGIN
      - "WEBUI_URL="
      # ATTENTION : Séparateur point-virgule (;) obligatoire pour Open WebUI
      - "CORS_ALLOW_ORIGIN=https://ui.${ECHO_DOMAIN:-localhost};https://www.${ECHO_DOMAIN:-localhost};http://localhost:3000;http://127.0.0.1:3000;https://${ECHO_DOMAIN:-localhost};${ECHO_DETECTED_ORIGINS}"

      # Sécurité Cookies (Recommandé Doc Officielle)
      - "WEBUI_SESSION_COOKIE_SECURE=false"
      - "WEBUI_AUTH_COOKIE_SECURE=false"
      - "WEBUI_SESSION_COOKIE_SAME_SITE=lax"
      - "WEBUI_AUTH_COOKIE_SAME_SITE=lax"

      - DATA_DIR=/app/backend/data
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-echo-secret-key-12345}
      - ECHO_VERSION_PATH=/app/backend/data/ECHO_VERSION
    volumes:
      - /opt/ECHO/ECHO_VERSION:/app/backend/data/ECHO_VERSION:ro
      - /opt/ECHO/owui-libs:/app/backend/echo_libs:ro
      - echo-webui-data:/app/backend/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
      # 🛡️ TUNING SECURE EDGE (BunkerWeb)
      - "bunkerweb.SERVER_NAME=ui.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-open-webui:8080"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"

      # 1. OPTIMISATIONS STREAMING & UPLOAD
      - "bunkerweb.REVERSE_PROXY_BUFFERING=off"
      - "bunkerweb.REVERSE_PROXY_REQUEST_BUFFERING=no"
      - "bunkerweb.MAX_CLIENT_BODY_SIZE=200m"
      - "bunkerweb.REVERSE_PROXY_READ_TIMEOUT=600"
      - "bunkerweb.REVERSE_PROXY_SEND_TIMEOUT=600"

      # 2. WEBSOCKETS
      - "bunkerweb.REVERSE_PROXY_WS=yes"

      # 3. RATE LIMITING (Stratégie SPA Robuste)
      - "bunkerweb.USE_LIMIT_REQ=yes"

      # Règle 1 : Assets Statiques & Websockets (ILLIMITÉ)
      # Cible tous les dossiers statiques SvelteKit + WS
      - "bunkerweb.LIMIT_REQ_URL_1=^/(_app|static|assets|favicon|ws|socket.io).*"
      - "bunkerweb.LIMIT_REQ_RATE_1=1000r/s"

      # Règle 2 : API Backend (Strict)
      - "bunkerweb.LIMIT_REQ_URL_2=^/(api|auth|ollama|openai).*"
      - "bunkerweb.LIMIT_REQ_RATE_2=20r/s"
      - "bunkerweb.LIMIT_REQ_BURST_2=50"

      # Règle 3 : Navigation Frontend (Souple)
      - "bunkerweb.LIMIT_REQ_URL=/"
      - "bunkerweb.LIMIT_REQ_RATE=50r/s"
      - "bunkerweb.LIMIT_REQ_BURST=100"

      # 4. SECURITE & WAF (Anti-Ban & Faux Positifs)
      - "bunkerweb.USE_MODSECURITY=yes"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=1"
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      # EXCLUSION CRITIQUE : Ne pas bannir sur 404 (Assets manquants) ni 429 (Rate Limit)
      - "bunkerweb.BAD_BEHAVIOR_STATUS_CODES=400 401 403 405 444 500 502 503 504"

      # Autoriser les verbes HTTP pour l'API (Suppression de chat, etc.)
      - "bunkerweb.ALLOWED_METHODS=GET|POST|HEAD|PUT|DELETE|OPTIONS"

      # Tuning ModSecurity pour API (Prompts IA)
      # Désactivation totale du moteur de règles pour /api/ afin d'éviter les faux positifs sur le contenu des chats (code, urls, etc.)
      - 'bunkerweb.CUSTOM_CONF_MODSEC_openwebui_tuning=SecRule REQUEST_URI "@beginsWith /api/" "id:10002,phase:1,pass,nolog,ctl:ruleEngine=Off"'   

      # 5. UX & PERFORMANCE
      - "bunkerweb.USE_BROTLI=yes"
      
      # 📍 Autoriser la géolocalisation pour ce serveur spécifique (Standard BunkerWeb)
      - "bunkerweb.PERMISSIONS_POLICY=geolocation=(self), camera=(self), microphone=(self)"      
    command: >
      /bin/bash -c "pip install mgzip && ./start.sh"

  # 2. Admin Manager (Dashboard Système ECHO)
  admin-manager:
    build:
      context: /opt/ECHO/docker-admin-manager
      dockerfile: Dockerfile
    container_name: echo-admin-manager
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Intégration BunkerWeb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
      - "bunkerweb.SERVER_NAME=am.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-admin-manager:3001"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=2"
      
      # 🛡️ SECURITE ADMIN : Assouplissement WAF pour l'Admin (Burst toléré)
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      - "bunkerweb.USE_LIMIT_REQ=yes"
      - "bunkerweb.LIMIT_REQ_RATE=20r/s"
      - "bunkerweb.LIMIT_REQ_BURST=100"
      
      # 🚫 ANTI-BOTS & INDEXATION
      - "bunkerweb.HEADERS_RESPONSE_NAME_1=X-Robots-Tag"
      - "bunkerweb.HEADERS_RESPONSE_VALUE_1=noindex, nofollow"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ECHO/docker-admin-manager/server.py:/app/server.py:ro
      - /opt/ECHO/echo-images:/app/static:ro
      - echo-backups:/backups
      - echo-webui-data:/app/backend/data
      - /opt/ECHO/.secrets:/app/secrets:ro
      - /opt/ECHO/ECHO_VERSION:/app/ECHO_VERSION:ro
    
    # EXPOSITION : Port 3001 ouvert pour le Reverse Proxy distant
    ports:
      - "3001:3001"

  # ============================================================================
  # SECTION 2 : WORKERS INTERNES (BACKEND)
  # ============================================================================
  
  python-worker:
    build:
      context: /opt/ECHO/docker-python-worker
      dockerfile: Dockerfile
    container_name: echo-python-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-python-worker/worker_api.py:/app/app.py:ro
      - echo-worker-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"

  browser-agent:
    image: python:3.14-slim
    container_name: echo-browser-agent
    restart: always
    networks:
      - echo-network
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-browser-agent/browser_api.py:/app/browser_api.py:ro
      - echo-browser-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    command: >
      /bin/bash -c "pip install --no-cache-dir fastapi uvicorn playwright html2text mgzip orjson pybase64 && playwright install --with-deps chromium && cd /app && uvicorn browser_api:app --host 0.0.0.0 --port 5002"

  # 3. SearxNG (Métamoteur de recherche souverain)
  searxng:
    image: searxng/searxng:latest
    container_name: echo-searxng
    restart: always
    networks:
      - echo-network
    volumes:
      - /opt/ECHO/config/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - TZ=Europe/Paris
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Watchtower (Auto-Update)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: echo-watchtower
    restart: always
    networks:
      - echo-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
      - DOCKER_API_VERSION=1.44
    command: --interval 3600 --cleanup

  # ============================================================================
  # SECTION 3 : INFRASTRUCTURE RAG & AUTOMATISATION
  # ============================================================================

  # 4. Qdrant (Base Vectorielle)
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: echo-qdrant
    restart: always
    networks:
      - echo-network
    ports:
      - "6333:6333"
    volumes:
      - echo-qdrant-data:/qdrant/storage
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # 6. ECHO Embedding Worker (BAAI/bge-m3 — Text RAG, multilingue, 1024d)
  embedding:
    build:
      context: /opt/ECHO/docker-embedding-worker
      dockerfile: Dockerfile
    container_name: echo-embedding
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
      - MODEL_ID=BAAI/bge-m3
      - MAX_LENGTH=512
    ports:
      - "7997:7997"
    volumes:
      - /opt/ECHO/docker-embedding-worker/app.py:/app/app.py:ro
      - echo-embedding-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 3g
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================

networks:
  echo-network:
    external: true


volumes:
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true
  echo-qdrant-data:
    external: true
  echo-embedding-cache:
    external: true

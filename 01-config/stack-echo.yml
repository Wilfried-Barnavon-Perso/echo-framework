# ==============================================================================
# ECHO FRAMEWORK
# Version : 9.62
# --- CHANGELOG 9.62 ---
# - Docker Compose (BunkerWeb) : Correction du fallback d'erreur 500 (@api_5xx_reject) pour retourner un JSON valide et éviter le crash du parseur SvelteKit lors de l'indisponibilité temporaire de l'auth-manager au démarrage.
# --- CHANGELOG 9.61 ---
# - Docker Compose (BunkerWeb) : Généralisation de la résolution DNS dynamique (set $$upstream) sur l'ensemble des locations custom de l'Open WebUI (authbackend, media, bypass, statics) pour corriger l'erreur 500 sur expiration de cache IP Nginx.
# --- CHANGELOG 9.60 ---
# - Docker Compose (BunkerWeb) : Mise en place de la résolution DNS dynamique (variables upstream) pour éviter le cache IP Nginx.
# --- CHANGELOG 9.59 ---
# - Docker Compose : Centralisation de la configuration de logging (logging.json) et montage sur tous les workers Python pour forcer l'horodatage ISO 8601.
# --- CHANGELOG 9.58 ---
# - Docker Compose : Correction des guillemets dans WEBUI_NAME provoquant une alerte de sécurité PWA sous Android.
# --- CHANGELOG 9.57 ---
# - Docker Compose : Interception de la route /auth pour prévenir la boucle de login native d'Open WebUI (issue 401).
# --- CHANGELOG 9.56 ---
# - Docker Compose : Correction de la boucle de déconnexion sur mobile (Remplacement du 200 OK par 302 Redirect sur la route /sso-logout).
# --- CHANGELOG 9.55 ---
# - Docker Compose : Ajout du réseau echo-sandbox pour isoler le Python Worker, ajout de echo-mcp-broker et standardisation echo-browser-worker.
# --- CHANGELOG 9.54 ---
# - Docker Compose : Standardisation des noms de services avec le préfixe echo-* et migration vers le worker d'embedding Harrier-OSS GGUF.
# ==============================================================================
#                  inventés par la syntaxe officielle BunkerWeb (REVERSE_PROXY_AUTH_REQUEST*).
#                 des modèles Open WebUI et conversion RequestBodyLimit en octets.
#                 et correction de l'anti-indexation (Admin Manager).
#                 commande uvicorn avec --reload pour permettre le hot-reload du TTS.
#                 en remplaçant `RAG_EMBEDDING_ENGINE=""` par `"openai"` pour
#                 éviter le téléchargement de modèles locaux sans faire crasher l'app.
#                 pour contourner PEP 668 sur Debian Bookworm et suppression de jq
#                 dans le healthcheck.
#                 exclusions CRS granulaires (SecRuleRemoveById) pour conserver
#                 le moteur WAF actif tout en eliminant les faux positifs OWUI.
#                 Ajout PATCH dans ALLOWED_METHODS. Retrait 400 de BAD_BEHAVIOR.
#                 open-webui pour le module ECHO Codex.
# Ce fichier ne gere QUE la couche applicative "ECHO".
# ==============================================================================

services:

  # 1. Open WebUI (Le Cœur d'ECHO)
  echo-open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: echo-open-webui
    restart: always
    networks:
      - echo-network
      - echo-sandbox
    ports:
      - "3000:8080"
      - "8020-8024:8020-8024"  # SSH tunnel ephemere PKCE - ports SSH uniquement (5 sessions max)
      # Ports callback 8025-8034 : internes uniquement - accessibles via tunnel SSH, JAMAIS exposes
    environment:
      - WEBUI_AUTH=True
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=${ECHO_DOMAIN:+X-Webui-User}
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=${ECHO_DOMAIN:+X-Webui-Name}
      - WEBUI_NAME=ECHO AI
      # - CSRF_TRUSTED_ORIGINS=https://ui.${ECHO_DOMAIN:-localhost}
      - FORWARDED_ALLOW_IPS=*
      - TZ=Europe/Paris
      # Configuration Reverse Proxy (Doc Officielle)
      - "WEBUI_URL=https://ui.${ECHO_DOMAIN:-localhost}"
      # 🛡️ ECHO AUTH : Redirection après déconnexion (Bounce local pour purger le Service Worker)
      - WEBUI_AUTH_SIGNOUT_REDIRECT_URL=https://ui.${ECHO_DOMAIN:-localhost}/sso-logout
      # ATTENTION : Séparateur point-virgule (;) obligatoire pour Open WebUI
      - "CORS_ALLOW_ORIGIN=https://ui.${ECHO_DOMAIN:-localhost};https://www.${ECHO_DOMAIN:-localhost};http://localhost:3000;http://127.0.0.1:3000;https://${ECHO_DOMAIN:-localhost};${ECHO_DETECTED_ORIGINS}"

      # Sécurité Cookies (Recommandé Doc Officielle)
      - "WEBUI_SESSION_COOKIE_SECURE=true"
      - "WEBUI_AUTH_COOKIE_SECURE=true"
      - "WEBUI_SESSION_COOKIE_SAME_SITE=lax"
      - "WEBUI_AUTH_COOKIE_SAME_SITE=lax"

      - DATA_DIR=/app/backend/data
      # Désactivation RAG natif au boot
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=dummy_model
      - ENABLE_RAG_WEB_SEARCH=false
      - ECHO_VERSION_PATH=/app/backend/data/ECHO_VERSION
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      # Désactivation de l'expiration du token interne (géré par SSO/WAF)
      - JWT_EXPIRES_IN=-1
    volumes:
      - /opt/ECHO/ECHO_VERSION:/app/backend/data/ECHO_VERSION:ro
      - /opt/ECHO/owui-libs:/app/backend/echo_libs:ro
      - /opt/ECHO/config/system-prompt.md:/app/backend/data/system-prompt.md:ro
      - echo-webui-data:/app/backend/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "echo.hot-reload=true"
      # 🛡️ TUNING SECURE EDGE (BunkerWeb)
      - "bunkerweb.SERVER_NAME=ui.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_main=set $$upstream_main http://echo-open-webui:8080;"
      - "bunkerweb.REVERSE_PROXY_HOST=$$upstream_main"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"
      # 1. OPTIMISATIONS STREAMING & UPLOAD
      - "bunkerweb.REVERSE_PROXY_BUFFERING=no"
      - "bunkerweb.REVERSE_PROXY_REQUEST_BUFFERING=yes"
      - "bunkerweb.MAX_CLIENT_SIZE=500m"
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_buffers=client_body_buffer_size 100m; proxy_buffer_size 128k; proxy_buffers 4 256k; proxy_busy_buffers_size 256k;"
      - "bunkerweb.REVERSE_PROXY_READ_TIMEOUT=600s"
      - "bunkerweb.REVERSE_PROXY_SEND_TIMEOUT=600s"
      - "bunkerweb.REVERSE_PROXY_CONNECT_TIMEOUT=60s"

      # 2. WEBSOCKETS & ENTÊTES
      - "bunkerweb.REVERSE_PROXY_WS=yes"
      - "bunkerweb.REVERSE_PROXY_PRESERVE_HOST=yes"
      - "bunkerweb.KEEP_UPSTREAM_HEADERS=*"

      # 🛡️ ROUTAGE WEBSOCKET POUR LE EDGE EMBEDDING
      # Priorité absolue Nginx via "location =" pour surpasser le proxy générique
      - |
        bunkerweb.CUSTOM_CONF_SERVER_HTTP_edgeembed=location = /ws/edge-embed {
            set $$upstream_embed http://echo-embedding:7997;
            proxy_pass $$upstream_embed;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
        }

      # 🛡️ ECHO AUTH : Forward Auth
      - "bunkerweb.REVERSE_PROXY_AUTH_REQUEST=/api/verify"
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_auth-error=error_page 401 = @auth_soft_reject; error_page 403 = @auth_hard_reject; error_page 500 502 503 504 = @api_5xx_reject; location @auth_soft_reject { default_type application/json; if ($$request_uri ~* ^/sw\\\\.js) { return 401 'Unauthorized'; } if ($$request_uri ~* ^/api/) { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_accept ~* application/json) { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_sec_fetch_dest = \"empty\") { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_x_sveltekit_data) { return 401 '{\"detail\":\"Unauthorized\"}'; } return 302 https://auth.${ECHO_DOMAIN:-localhost}/login?next=https://$$host$$request_uri; } location @auth_hard_reject { default_type application/json; if ($$request_uri ~* ^/sw\\\\\\\\.js) { return 401 'Unauthorized'; } if ($$request_uri ~* ^/api/) { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_accept ~* application/json) { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_sec_fetch_dest = \"empty\") { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_x_sveltekit_data) { return 401 '{\"detail\":\"Unauthorized\"}'; } return 302 https://auth.${ECHO_DOMAIN:-localhost}/login?next=https://$$host$$request_uri; } location @api_5xx_reject { default_type application/json; if ($$request_uri ~* ^/api/) { return 502 '{\"detail\":\"Internal Proxy Error (502)\"}'; } return 500 '{\"detail\":\"Internal Error (500)\"}'; }"
      - "bunkerweb.REVERSE_PROXY_AUTH_REQUEST_SET=$$webui_user $$upstream_http_x_webui_user;$$webui_name $$upstream_http_x_webui_name"
      - "bunkerweb.REVERSE_PROXY_HEADERS=X-Webui-User $$webui_user;X-Webui-Name $$webui_name"

      # 🔓 EXCLUSION UPLOADS (WORKAROUND FETCH) : Empêche le 401 WAF sur les uploads multimédias tout en conservant la sécurité du Bearer Token applicatif
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_media=location ~ ^/api/v1/(files|audio|images) { auth_request off; set $$upstream_owui http://echo-open-webui:8080; proxy_pass $$upstream_owui; proxy_set_header Host $$host; proxy_set_header X-Real-IP $$remote_addr; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; }"

      # 🛡️ ECHO AUTH BACKEND (Nginx internal proxy_pass sécurisé contre le transfert de Content-Length)
      # On crée manuellement la location Nginx sans passer par la macro REVERSE_PROXY_URL_2
      # pour garantir l'absence de buffering et de Content-Length sur l'appel d'auth.
      - |
        bunkerweb.CUSTOM_CONF_SERVER_HTTP_authbackend=location = /api/verify {
            internal;
            set $$upstream_auth http://echo-auth-manager:8000;
            proxy_pass $$upstream_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $$request_uri;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
        }

      # (Les intercepteurs /auth ont été supprimés car ils provoquaient une boucle infinie)

      # 💀 SERVICE WORKER KILL-SWITCH (PROPRE) : Retourne 404 pour forcer le navigateur à désenregistrer la PWA en silence, sans causer de race condition au rechargement.
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_sw=location = /sw.js { auth_request off; return 404; }"

      # 🧹 PURGE SW VIA LOGOUT : Point de chute de la déconnexion
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_ssologout=location = /sso-logout { auth_request off; return 302 https://auth.${ECHO_DOMAIN:-localhost}/logout?next=https://ui.${ECHO_DOMAIN:-localhost}; }"


      # 🔓 EXCLUSION API PUBLIQUES : Permet au frontend de s'initialiser avant de rediriger proprement
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_bypass=location ~ ^/api/(version|config) { auth_request off; set $$upstream_owui http://echo-open-webui:8080; proxy_pass $$upstream_owui; proxy_set_header Host $$host; proxy_set_header X-Real-IP $$remote_addr; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; }"

      # 🔓 EXCLUSION FICHIERS STATIQUES : Requis pour la PWA, les assets et la mise à jour du Service Worker
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_statics=location ~ ^/(assets|static|_app|manifest\\.json|favicon.*\\.png|robots\\.txt) { auth_request off; set $$upstream_owui http://echo-open-webui:8080; proxy_pass $$upstream_owui; proxy_set_header Host $$host; proxy_set_header X-Real-IP $$remote_addr; proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $$scheme; }"


      # 🚫 ANTI-CACHE DYNAMIQUE (Pour forcer l'interception SSO sur le HTML)
      - "bunkerweb.CUSTOM_CONF_HTTP_mapcache=map $$sent_http_content_type $$html_cache_control { default \"\"; \"~*text/html\" \"no-store, no-cache, must-revalidate, max-age=0\"; }"
      - "bunkerweb.CUSTOM_HEADER_cache=Cache-Control: $$html_cache_control"

      # 3. RATE LIMITING (Stratégie SPA Robuste)
      - "bunkerweb.USE_LIMIT_REQ=yes"
      - "bunkerweb.LIMIT_REQ_RATE=100r/s"
      - "bunkerweb.LIMIT_REQ_BURST=300"

      # 4. SECURITE (Anti-Ban)
      - "bunkerweb.USE_MODSECURITY=no"
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      # EXCLUSION CRITIQUE : Ne pas bannir sur les erreurs 5xx (timeout ou surcharge applicative)
      # 400 retiré : les SPA génèrent légitimement des 400 sur les preflight CORS
      - "bunkerweb.BAD_BEHAVIOR_STATUS_CODES=405 444"
      # ⚡ EXCLUSION 401 DE L'INTERCEPTION : Empêche BunkerWeb de générer error_page 401 @bwerror401
      # qui écrase notre error_page 401 = @auth_redirect (SSO redirect) dans auth-error.conf
      - "bunkerweb.INTERCEPTED_ERROR_CODES=400 403 404 405 413 429 500 501 502 503 504"

      # Autoriser les verbes HTTP pour l'API (Suppression de chat, édition, etc.)
      - "bunkerweb.ALLOWED_METHODS=GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS"


      # 5. UX & PERFORMANCE
      - "bunkerweb.USE_BROTLI=yes"
      
      # 📍 Autoriser la géolocalisation pour ce serveur spécifique (Standard BunkerWeb)
      - "bunkerweb.PERMISSIONS_POLICY=geolocation=(self), camera=(self), microphone=(self)"      
    command: >
      /bin/bash -c "PIP_BREAK_SYSTEM_PACKAGES=1 CMAKE_BUILD_PARALLEL_LEVEL=$$(nproc --ignore=1) pip install mgzip dulwich 'markitdown[all]' && ./start.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      echo-qdrant:
        condition: service_healthy
      echo-embedding:
        condition: service_healthy
      echo-searxng:
        condition: service_healthy
      echo-mcp-broker:
        condition: service_healthy

  # 2. Admin Manager (Dashboard Système ECHO)
  echo-admin-manager:
    build:
      context: /opt/ECHO/docker-admin-manager
      dockerfile: Dockerfile
    container_name: echo-admin-manager
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
      - ECHO_SSO_SECRET=${ECHO_SSO_SECRET}
      - ECHO_DOMAIN=${ECHO_DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Intégration BunkerWeb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
      - "bunkerweb.SERVER_NAME=am.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-admin-manager:3001"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=yes"
      # 🛡️ ECHO AUTH : Forward Auth + SSO Secret (Syntaxe Officielle BunkerWeb 1.6)
      - "bunkerweb.REVERSE_PROXY_AUTH_REQUEST=/api/verify"
      - "bunkerweb.CUSTOM_CONF_SERVER_HTTP_auth-error=error_page 401 = @auth_soft_reject; error_page 403 = @auth_hard_reject; location @auth_soft_reject { default_type application/json; if ($$request_uri ~* \\\"^/sw\\\\\\\\.js\\\") { return 401 'Unauthorized'; } if ($$request_uri ~* \\\"^/api/\\\") { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_accept ~* \\\"application/json\\\") { return 401 '{\"detail\":\"Unauthorized\"}'; } return 302 https://auth.${ECHO_DOMAIN:-localhost}/login?next=https://$$host$$request_uri; } location @auth_hard_reject { default_type application/json; if ($$request_uri ~* \\\"^/sw\\\\\\\\.js\\\") { return 401 'Unauthorized'; } if ($$request_uri ~* \\\"^/api/\\\") { return 401 '{\"detail\":\"Unauthorized\"}'; } if ($$http_accept ~* \\\"application/json\\\") { return 401 '{\"detail\":\"Unauthorized\"}'; } return 302 https://auth.${ECHO_DOMAIN:-localhost}/login?next=https://$$host$$request_uri; }"
      - "bunkerweb.REVERSE_PROXY_AUTH_REQUEST_SET=$$webui_user $$upstream_http_x_webui_user;$$webui_name $$upstream_http_x_webui_name;$$dummy $$upstream_http_dummy"
      - "bunkerweb.REVERSE_PROXY_HEADERS=X-Webui-User $$webui_user;X-Webui-Name $$webui_name;X-Echo-Sso-Secret ${ECHO_SSO_SECRET}"
      
      # 🛡️ ECHO AUTH BACKEND (Nginx internal proxy_pass sécurisé contre le transfert de Content-Length)
      # On crée manuellement la location Nginx sans passer par la macro REVERSE_PROXY_URL_2
      # pour garantir l'absence de buffering et de Content-Length sur l'appel d'auth.
      - |
        bunkerweb.CUSTOM_CONF_SERVER_HTTP_authbackend=location = /api/verify {
            internal;
            set $$upstream_auth http://echo-auth-manager:8000;
            proxy_pass $$upstream_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $$request_uri;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
        }
      # 🛡️ SECURITE ADMIN : Assouplissement WAF pour l'Admin (Burst toléré)
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      - "bunkerweb.USE_LIMIT_REQ=yes"
      - "bunkerweb.LIMIT_REQ_RATE=50r/s"
      - "bunkerweb.LIMIT_REQ_BURST=150"
      # ⚡ EXCLUSION 401 DE L'INTERCEPTION : Empêche BunkerWeb de générer error_page 401 @bwerror401
      # qui écrase notre error_page 401 = @auth_redirect (SSO redirect) dans auth-error.conf
      - "bunkerweb.INTERCEPTED_ERROR_CODES=400 403 404 405 413 429 500 501 502 503 504"
      
      # 🚫 ANTI-BOTS & INDEXATION
      - "bunkerweb.CUSTOM_HEADER_1=X-Robots-Tag: noindex, nofollow"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ECHO/docker-admin-manager/server.py:/app/server.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
      - /opt/ECHO/echo-images:/app/static:ro
      - echo-backups:/backups
      - echo-webui-data:/app/backend/data
      - echo-qdrant-data:/qdrant/storage
      - echo-auth-data:/app/auth-data
      - /opt/ECHO/.secrets:/app/secrets:ro
      - /opt/ECHO/ECHO_VERSION:/app/ECHO_VERSION:ro
    
    # EXPOSITION : Port 3001 ouvert pour le Reverse Proxy distant
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3001/\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      echo-open-webui:
        condition: service_healthy

  # ============================================================================
  # SECTION 2 : WORKERS INTERNES (BACKEND)
  # ============================================================================
  
  echo-mcp-broker:
    build:
      context: /opt/ECHO/docker-mcp-broker
      dockerfile: Dockerfile
    container_name: echo-mcp-broker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-mcp-broker/server.py:/app/server.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
      - /opt/ECHO/docker-mcp-broker/core:/app/core:ro
      - /opt/ECHO/docker-mcp-broker/modules:/app/modules:ro
      - echo-webui-data:/app/backend/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/ping\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  echo-python-worker:
    build:
      context: /opt/ECHO/docker-python-worker
      dockerfile: Dockerfile
    container_name: echo-python-worker
    restart: always
    networks:
      - echo-sandbox
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-python-worker/worker_api.py:/app/app.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
      - echo-worker-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  echo-browser-worker:
    image: python:3.14-slim
    container_name: echo-browser-worker
    restart: always
    networks:
      - echo-network
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-browser-worker/browser_api.py:/app/browser_api.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
      - echo-browser-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    command: >
      /bin/bash -c "CMAKE_BUILD_PARALLEL_LEVEL=$$(nproc --ignore=1) pip install --no-cache-dir fastapi uvicorn playwright html2text mgzip orjson pybase64 httpx Pillow && playwright install --with-deps chromium && cd /app && uvicorn browser_api:app --host 0.0.0.0 --port 5002 --log-config /app/logging.json"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5002/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  echo-n8n-worker:
    build:
      context: /opt/ECHO/docker-n8n-worker
      dockerfile: Dockerfile
    container_name: echo-n8n-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
      - N8N_ENCRYPTION_KEY
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV
      - N8N_INSTANCE_OWNER_EMAIL
      - N8N_INSTANCE_OWNER_FIRST_NAME
      - N8N_INSTANCE_OWNER_LAST_NAME
      - N8N_INSTANCE_OWNER_PASSWORD
      # Figeage des futures dépréciations pour maintenir la compatibilité ECHO
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=2147483648
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=5000
    volumes:
      - echo-browser-data:/app/browser-data:rw
      - echo-n8n-data:/home/node/.n8n:rw
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5003/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  echo-stt-worker:
    build:
      context: /opt/ECHO/docker-stt-worker
      dockerfile: Dockerfile
    container_name: echo-stt-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    volumes:
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7995/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  echo-tts-worker:
    build:
      context: /opt/ECHO/docker-tts-worker
      dockerfile: Dockerfile
    container_name: echo-tts-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    volumes:
      - /opt/ECHO/docker-tts-worker/tts_api.py:/app/tts_api.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
    command: ["uvicorn", "tts_api:app", "--host", "0.0.0.0", "--port", "7996", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7996/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 3. SearxNG (Métamoteur de recherche souverain)
  echo-searxng:
    image: searxng/searxng:latest
    container_name: echo-searxng
    restart: always
    networks:
      - echo-network
    volumes:
      - /opt/ECHO/config/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - TZ=Europe/Paris
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    labels:
      - "echo.hot-reload=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 5. Watchtower (Auto-Update)
  echo-watchtower:
    image: containrrr/watchtower:latest
    container_name: echo-watchtower
    restart: always
    networks:
      - echo-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
      - DOCKER_API_VERSION=1.44
    command: --interval 3600 --cleanup

  # ============================================================================
  # SECTION 3 : INFRASTRUCTURE RAG & AUTOMATISATION
  # ============================================================================

  # 4. Qdrant (Base Vectorielle)
  echo-qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: echo-qdrant
    restart: always
    networks:
      - echo-network
    volumes:
      - echo-qdrant-data:/qdrant/storage
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. ECHO Embedding Worker (microsoft/Harrier-OSS-v1-0.6B — Text RAG, multilingue, 1024d)
  echo-embedding:
    build:
      context: /opt/ECHO/docker-embedding-worker
      dockerfile: Dockerfile
    container_name: echo-embedding
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
      - MODEL_ID=microsoft/Harrier-OSS-v1-0.6B
      - GGUF_FILE=harrier-oss-v1-0.6b.f16.gguf
      - MAX_LENGTH=4096
    volumes:
      - /opt/ECHO/docker-embedding-worker/app.py:/app/app.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
      - echo-embedding-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 3g
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7997/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s
    depends_on:
      echo-qdrant:
        condition: service_healthy

  # 7. ECHO Download Broker (Ingestion asynchrone Playwright)
  echo-download-broker:
    build:
      context: /opt/ECHO/docker-download-broker
      dockerfile: Dockerfile
    container_name: echo-download-broker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - echo-webui-data:/app/backend/data:rw
      - echo-browser-data:/app/browser-data:rw
      - /opt/ECHO/owui-libs:/app/backend/echo_libs:ro
      - /opt/ECHO/docker-download-broker/download_broker.py:/app/download_broker.py:ro
      - ${ECHO_CONFIG}/logging.json:/app/logging.json:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    depends_on:
      echo-browser-worker:
        condition: service_healthy

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================

networks:
  echo-network:
    external: true
  echo-sandbox:
    external: true


volumes:
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true
  echo-qdrant-data:
    external: true
  echo-embedding-cache:
    external: true
  echo-auth-data:
    external: true
  echo-n8n-data:
    external: true

# ==============================================================================
# ECHO FRAMEWORK
# Version : 9.6
# ==============================================================================
# CHANGELOG 9.6 : Ajout du montage de volume pour tts_api.py et override de la 
#                 commande uvicorn avec --reload pour permettre le hot-reload du TTS.
# CHANGELOG 9.5 : Fix crash backend `ValueError: Unknown embedding engine: ""` 
#                 en remplaçant `RAG_EMBEDDING_ENGINE=""` par `"openai"` pour
#                 éviter le téléchargement de modèles locaux sans faire crasher l'app.
# CHANGELOG 9.4 : Fix erreur `unhealthy` Open WebUI. Ajout PIP_BREAK_SYSTEM_PACKAGES=1 
#                 pour contourner PEP 668 sur Debian Bookworm et suppression de jq
#                 dans le healthcheck.
# CHANGELOG 9.3 : Tuning WAF ModSecurity - Remplacement ruleEngine=Off par
#                 exclusions CRS granulaires (SecRuleRemoveById) pour conserver
#                 le moteur WAF actif tout en eliminant les faux positifs OWUI.
#                 Ajout PATCH dans ALLOWED_METHODS. Retrait 400 de BAD_BEHAVIOR.
# CHANGELOG 9.2 : Ajout dulwich (Git pur Python) dans la commande de demarrage
#                 open-webui pour le module ECHO Codex.
# CHANGELOG 8.9 : Tunnel SSH ephemere PKCE (asyncssh).
# Ce fichier ne gere QUE la couche applicative "ECHO".
# ==============================================================================

services:

  # 1. Open WebUI (Le Cœur d'ECHO)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: echo-open-webui
    restart: always
    networks:
      - echo-network
    ports:
      - "3000:8080"
      - "8020-8024:8020-8024"  # SSH tunnel ephemere PKCE - ports SSH uniquement (5 sessions max)
      # Ports callback 8025-8034 : internes uniquement - accessibles via tunnel SSH, JAMAIS exposes
    environment:
      - WEBUI_AUTH=True
      - WEBUI_NAME="ECHO AI"
      # - CSRF_TRUSTED_ORIGINS=https://ui.${ECHO_DOMAIN:-localhost}
      - FORWARDED_ALLOW_IPS=*
      - TZ=Europe/Paris
      # Configuration Reverse Proxy (Doc Officielle)
      # - "WEBUI_URL=https://ui.${ECHO_DOMAIN:-localhost}"
      # Configuration vide car multi accès possible (privée, public www/ui ...). Sécurité par CORS_ALLOW_ORIGIN
      - "WEBUI_URL="
      # ATTENTION : Séparateur point-virgule (;) obligatoire pour Open WebUI
      - "CORS_ALLOW_ORIGIN=https://ui.${ECHO_DOMAIN:-localhost};https://www.${ECHO_DOMAIN:-localhost};http://localhost:3000;http://127.0.0.1:3000;https://${ECHO_DOMAIN:-localhost};${ECHO_DETECTED_ORIGINS}"

      # Sécurité Cookies (Recommandé Doc Officielle)
      - "WEBUI_SESSION_COOKIE_SECURE=false"
      - "WEBUI_AUTH_COOKIE_SECURE=false"
      - "WEBUI_SESSION_COOKIE_SAME_SITE=lax"
      - "WEBUI_AUTH_COOKIE_SAME_SITE=lax"

      - DATA_DIR=/app/backend/data
      # Désactivation RAG natif au boot
      - RAG_EMBEDDING_ENGINE=openai
      - ENABLE_RAG_WEB_SEARCH=False
      - ECHO_VERSION_PATH=/app/backend/data/ECHO_VERSION
    volumes:
      - /opt/ECHO/ECHO_VERSION:/app/backend/data/ECHO_VERSION:ro
      - /opt/ECHO/owui-libs:/app/backend/echo_libs:ro
      - echo-webui-data:/app/backend/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
      # 🛡️ TUNING SECURE EDGE (BunkerWeb)
      - "bunkerweb.SERVER_NAME=ui.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-open-webui:8080"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"

      # 1. OPTIMISATIONS STREAMING & UPLOAD
      - "bunkerweb.REVERSE_PROXY_BUFFERING=off"
      - "bunkerweb.REVERSE_PROXY_REQUEST_BUFFERING=no"
      - "bunkerweb.MAX_CLIENT_BODY_SIZE=200m"
      - "bunkerweb.REVERSE_PROXY_READ_TIMEOUT=600"
      - "bunkerweb.REVERSE_PROXY_SEND_TIMEOUT=600"

      # 2. WEBSOCKETS
      - "bunkerweb.REVERSE_PROXY_WS=yes"

      # 3. RATE LIMITING (Stratégie SPA Robuste)
      - "bunkerweb.USE_LIMIT_REQ=yes"

      # Règle 1 : Assets Statiques & Websockets (ILLIMITÉ)
      # Cible tous les dossiers statiques SvelteKit + WS
      - "bunkerweb.LIMIT_REQ_URL_1=^/(_app|static|assets|favicon|ws|socket.io).*"
      - "bunkerweb.LIMIT_REQ_RATE_1=1000r/s"

      # Règle 2 : API Backend (Strict)
      - "bunkerweb.LIMIT_REQ_URL_2=^/(api|auth|ollama|openai).*"
      - "bunkerweb.LIMIT_REQ_RATE_2=20r/s"
      - "bunkerweb.LIMIT_REQ_BURST_2=50"

      # Règle 3 : Navigation Frontend (Souple)
      - "bunkerweb.LIMIT_REQ_URL=/"
      - "bunkerweb.LIMIT_REQ_RATE=50r/s"
      - "bunkerweb.LIMIT_REQ_BURST=100"

      # 4. SECURITE & WAF (Anti-Ban & Faux Positifs)
      - "bunkerweb.USE_MODSECURITY=yes"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=1"
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      # EXCLUSION CRITIQUE : Ne pas bannir sur 404 (Assets manquants) ni 429 (Rate Limit)
      # 400 retiré : les SPA génèrent légitimement des 400 sur les preflight CORS
      - "bunkerweb.BAD_BEHAVIOR_STATUS_CODES=401 403 405 444 500 502 503 504"

      # Autoriser les verbes HTTP pour l'API (Suppression de chat, édition, etc.)
      - "bunkerweb.ALLOWED_METHODS=GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS"

      # Tuning ModSecurity : Exclusions CRS Granulaires (moteur WAF conservé ACTIF)
      # Stratégie : SecRuleRemoveById chirurgical sur les règles générant des faux
      # positifs documentés sur les applications LLM/SPA. Le WAF reste opérationnel
      # et continue de bloquer les scanners, bots et tentatives d'exploitation réelles.
      #
      # Groupe 1 : Corps de requête (Prompts IA, JSON complexes)
      #   920230 Multiple URL encodings, 921151 HTTP param pollution
      #   941101/941160 XSS Detection, 942421 SQLi restricted chars
      # Groupe 2 : Méthodes HTTP (DELETE suppression chat, PATCH édition)
      #   911100 Method not allowed
      # Groupe 3 : Upload de fichiers (multipart MIME variés, gros fichiers)
      #   920420 Content-Type not allowed, 200003 Multipart parser anomaly
      # Groupe 4 : Headers (CORS preflight, requêtes SPA internes)
      #   920300 Accept header missing, 920320 Missing User-Agent
      - "bunkerweb.CUSTOM_CONF_MODSEC_CRS_openwebui_tuning=SecRuleRemoveById 920230 921151 941101 941160 942421 911100 920420 200003 920300 920320"


      # 5. UX & PERFORMANCE
      - "bunkerweb.USE_BROTLI=yes"
      
      # 📍 Autoriser la géolocalisation pour ce serveur spécifique (Standard BunkerWeb)
      - "bunkerweb.PERMISSIONS_POLICY=geolocation=(self), camera=(self), microphone=(self)"      
    command: >
      /bin/bash -c "PIP_BREAK_SYSTEM_PACKAGES=1 CMAKE_BUILD_PARALLEL_LEVEL=$$(nproc) pip install mgzip dulwich && ./start.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      searxng:
        condition: service_healthy

  # 2. Admin Manager (Dashboard Système ECHO)
  admin-manager:
    build:
      context: /opt/ECHO/docker-admin-manager
      dockerfile: Dockerfile
    container_name: echo-admin-manager
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Intégration BunkerWeb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
      - "bunkerweb.SERVER_NAME=am.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-admin-manager:3001"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=2"
      
      # 🛡️ SECURITE ADMIN : Assouplissement WAF pour l'Admin (Burst toléré)
      - "bunkerweb.USE_BAD_BEHAVIOR=yes"
      - "bunkerweb.USE_LIMIT_REQ=yes"
      - "bunkerweb.LIMIT_REQ_RATE=20r/s"
      - "bunkerweb.LIMIT_REQ_BURST=100"
      
      # 🚫 ANTI-BOTS & INDEXATION
      - "bunkerweb.HEADERS_RESPONSE_NAME_1=X-Robots-Tag"
      - "bunkerweb.HEADERS_RESPONSE_VALUE_1=noindex, nofollow"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/ECHO/docker-admin-manager/server.py:/app/server.py:ro
      - /opt/ECHO/echo-images:/app/static:ro
      - echo-backups:/backups
      - echo-webui-data:/app/backend/data
      - echo-qdrant-data:/qdrant/storage
      - /opt/ECHO/.secrets:/app/secrets:ro
      - /opt/ECHO/ECHO_VERSION:/app/ECHO_VERSION:ro
    
    # EXPOSITION : Port 3001 ouvert pour le Reverse Proxy distant
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3001/\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      open-webui:
        condition: service_healthy

  # ============================================================================
  # SECTION 2 : WORKERS INTERNES (BACKEND)
  # ============================================================================
  
  python-worker:
    build:
      context: /opt/ECHO/docker-python-worker
      dockerfile: Dockerfile
    container_name: echo-python-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-python-worker/worker_api.py:/app/app.py:ro
      - echo-worker-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  browser-agent:
    image: python:3.14-slim
    container_name: echo-browser-agent
    restart: always
    networks:
      - echo-network
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - TZ=Europe/Paris
    volumes:
      - /opt/ECHO/docker-browser-agent/browser_api.py:/app/browser_api.py:ro
      - echo-browser-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    command: >
      /bin/bash -c "CMAKE_BUILD_PARALLEL_LEVEL=$$(nproc) pip install --no-cache-dir fastapi uvicorn playwright html2text mgzip orjson pybase64 && playwright install --with-deps chromium && cd /app && uvicorn browser_api:app --host 0.0.0.0 --port 5002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5002/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  stt-worker:
    build:
      context: /opt/ECHO/docker-stt-worker
      dockerfile: Dockerfile
    container_name: echo-stt-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7995/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  tts-worker:
    build:
      context: /opt/ECHO/docker-tts-worker
      dockerfile: Dockerfile
    container_name: echo-tts-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    volumes:
      - /opt/ECHO/docker-tts-worker/tts_api.py:/app/tts_api.py:ro
    command: ["uvicorn", "tts_api:app", "--host", "0.0.0.0", "--port", "7996", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7996/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 3. SearxNG (Métamoteur de recherche souverain)
  searxng:
    image: searxng/searxng:latest
    container_name: echo-searxng
    restart: always
    networks:
      - echo-network
    volumes:
      - /opt/ECHO/config/searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - TZ=Europe/Paris
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 5. Watchtower (Auto-Update)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: echo-watchtower
    restart: always
    networks:
      - echo-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
      - DOCKER_API_VERSION=1.44
    command: --interval 3600 --cleanup

  # ============================================================================
  # SECTION 3 : INFRASTRUCTURE RAG & AUTOMATISATION
  # ============================================================================

  # 4. Qdrant (Base Vectorielle)
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: echo-qdrant
    restart: always
    networks:
      - echo-network
    volumes:
      - echo-qdrant-data:/qdrant/storage
    environment:
      - TZ=Europe/Paris
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. ECHO Embedding Worker (BAAI/bge-m3 — Text RAG, multilingue, 1024d)
  embedding:
    build:
      context: /opt/ECHO/docker-embedding-worker
      dockerfile: Dockerfile
    container_name: echo-embedding
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
      - MODEL_ID=BAAI/bge-m3
      - MAX_LENGTH=512
    volumes:
      - /opt/ECHO/docker-embedding-worker/app.py:/app/app.py:ro
      - echo-embedding-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 3g
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "echo.hot-reload=true"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7997/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s
    depends_on:
      qdrant:
        condition: service_healthy

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================

networks:
  echo-network:
    external: true


volumes:
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true
  echo-qdrant-data:
    external: true
  echo-embedding-cache:
    external: true

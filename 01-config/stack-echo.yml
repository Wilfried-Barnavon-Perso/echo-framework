version: '3.8'

# ==============================================================================
# ECHO FRAMEWORK
# Version : 7.1
# ==============================================================================
# ARCHITECTURE :
# Ce fichier ne gère QUE la couche applicative "ECHO".
# ==============================================================================

services:

  # ============================================================================
  # SECTION 1 : APPLICATIONS PRINCIPALES
  # ============================================================================

  # 1. Open WebUI (Application IA)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: echo-webui-core
    restart: unless-stopped
    volumes:
      - echo-webui-data:/app/backend/data
      - /opt/ECHO_VERSION:/app/backend/data/ECHO_VERSION:ro
    # EXPOSITION : Port 3000 pour accès direct, Labels pour accès BunkerWeb
    ports:
      - "3000:8080"
    networks:
      - echo-network
    environment:
      - WEBUI_AUTH=True
      - TZ=Europe/Paris
    
    # Intégration BunkerWeb (Activée si la stack BunkerWeb tourne)
    labels:
      - "bunkerweb.SERVER_NAME=ui.${ECHO_DOMAIN:-localhost} www.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-webui-core:8080"
      
      # Optimisations LLM (Streaming)
      - "bunkerweb.USE_GZIP=no"
      - "bunkerweb.REVERSE_PROXY_WS=yes"
      - "bunkerweb.REVERSE_PROXY_BUFFERING=off"
      - "bunkerweb.MAX_CLIENT_BODY_SIZE=50m"
      - "bunkerweb.reverse_proxy_read_timeout=600"
      - "bunkerweb.reverse_proxy_send_timeout=600"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=1"
      
    command: >
      /bin/bash -c "pip install mgzip && ./start.sh"

  # 2. Admin Manager (Dashboard Système ECHO)
  admin-manager:
    # Construction locale pour performance et stabilité (Plus de pip install au boot)
    build:
      context: /opt/docker-admin-manager
      dockerfile: Dockerfile
    image: echo-admin-manager:local
    container_name: echo-admin-manager
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Intégration BunkerWeb
    labels:
      - "bunkerweb.SERVER_NAME=am.${ECHO_DOMAIN:-localhost}"
      - "bunkerweb.AUTO_LETS_ENCRYPT=yes"
      - "bunkerweb.USE_REVERSE_PROXY=yes"
      - "bunkerweb.REVERSE_PROXY_URL=/"
      - "bunkerweb.REVERSE_PROXY_HOST=http://echo-admin-manager:3001"
      - "bunkerweb.REVERSE_PROXY_INTERCEPT_ERRORS=no"
      - "bunkerweb.MODSEC_CRS_PARANOIA_LEVEL=2"
      - "bunkerweb.HEADERS_RESPONSE_NAME_1=X-Robots-Tag"
      - "bunkerweb.HEADERS_RESPONSE_VALUE_1=noindex, nofollow"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Montage du code en lecture seule pour mises à jour sans rebuild complet si besoin
      - /opt/docker-admin-manager/server.py:/app/server.py:ro
      - echo-backups:/backups
      - echo-webui-data:/app/backend/data
      - /opt/.owui-secrets:/app/secrets:ro
      - /opt/ECHO_VERSION:/app/ECHO_VERSION:ro
    
    # EXPOSITION : Port 3001 ouvert pour le Reverse Proxy distant
    ports:
      - "3001:3001"

  # ============================================================================
  # SECTION 2 : WORKERS INTERNES (BACKEND)
  # ============================================================================
  
  python-worker:
    image: python:3.11-slim
    container_name: echo-python-worker
    restart: always
    networks:
      - echo-network
    environment:
      - TZ=Europe/Paris
    volumes:
      - /opt/docker-python-worker/worker_api.py:/app/app.py:ro
      - echo-worker-data:/app/data
    command: >
      /bin/bash -c "pip install --no-cache-dir flask flask-cors requests pandas numpy scipy scikit-learn matplotlib seaborn yfinance beautifulsoup4 openpyxl regex sympy && python /app/app.py"

  browser-agent:
    image: python:3.11-slim
    container_name: echo-browser-agent
    restart: always
    networks:
      - echo-network
    ipc: host
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - TZ=Europe/Paris
    volumes:
      - /opt/docker-browser-agent/browser_api.py:/app/app.py:ro
      - echo-browser-data:/app/data
    command: >
      /bin/bash -c "apt-get update && apt-get install -y chromium fonts-liberation libasound2 libnss3 libgbm1 libnspr4 xdg-utils && pip install --no-cache-dir flask flask-cors DrissionPage html2text && python /app/app.py"

  watchtower:
    image: containrrr/watchtower
    container_name: echo-watchtower
    restart: always
    networks:
      - echo-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
    command: --interval 3600 --cleanup

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================

networks:
  echo-network:
    external: true


volumes:
  echo-webui-data:
    external: true
  echo-worker-data:
    external: true
  echo-browser-data:
    external: true
  echo-backups:
    external: true